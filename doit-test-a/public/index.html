<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박정윤 할일</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 16px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: orange;
            color: #222;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        h1 { margin: 0 4px 4px 4px; font-size: 24px; }
        .date { color: #888; font-size: 14px; margin-bottom: 20px; margin-left: 4px; }
        form { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        button {
            padding: 10px 16px;
            background: #5850ec;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }
        .todo-item.completed span {
            text-decoration: line-through;
            color: #aaa;
        }
        .delete-btn {
            background: #ef4444;
            padding: 6px 10px;
            font-size: 13px;
        }
        .delete-btn:hover { background: #dc2626; }
        .empty {
            text-align: center;
            color: #888;
            margin-top: 30px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>박정윤 할일</h1>
        <div class="date" id="current-date"></div>

        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="할일을 입력하세요" autocomplete="off" required>
            <button type="submit">추가</button>
        </form>

        <div id="todo-list"></div>
    </div>

    <script>
        // 날짜 표시
        const dateEl = document.getElementById('current-date');
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        dateEl.textContent = today.toLocaleDateString('ko-KR', options);

        // LocalStorage를 이용한 할 일 관리
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');

        function saveAndRender() {
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
        }

        function renderTodos() {
            todoList.innerHTML = '';
            if (todos.length === 0) {
                todoList.innerHTML = '<div class="empty">오늘 할일이 없습니다</div>';
                return;
            }

            todos.forEach((todo, index) => {
                const item = document.createElement('div');
                item.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                
                item.innerHTML = `
                    <div class="todo-left">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} onclick="toggleTodo(${index})">
                        <span>${todo.text}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(${index})">삭제</button>
                `;
                todoList.appendChild(item);
            });
        }

        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            todos.push({ text: text, completed: false });
            todoInput.value = '';
            saveAndRender();
        });

        window.toggleTodo = function(index) {
            todos[index].completed = !todos[index].completed;
            saveAndRender();
        }

        window.deleteTodo = function(index) {
            todos.splice(index, 1);
            saveAndRender();
        }

        // 초기 렌더링
        renderTodos();
    </script>
</body>
</html>
